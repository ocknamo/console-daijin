name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # npm 12 (required by the install-script policy) needs Node 22.22+.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Use npm 12
        run: npm install -g npm@12.2.2

      - run: npm ci

      - name: Type-check browser and Node sources
        run: npm run typecheck

      - name: Build and test
        run: npm test
